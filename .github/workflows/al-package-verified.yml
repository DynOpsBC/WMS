name: AL verified package
on:
  workflow_dispatch:
permissions:
  # Draft release assets require write-level repository access to be visible.
  contents: write
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Microsoft AL compiler
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.Dynamics.BusinessCentral.Development.Tools --version 18.0.41.39415
          if ($LASTEXITCODE -ne 0) { throw 'AL compiler installation failed' }
          al --version
      - name: Download verified Microsoft BC 28.1 symbol cache
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download build-bade-142-symbols --repo $env:GITHUB_REPOSITORY --pattern bade-bc28-symbols.zip --dir symbol-input
          if ($LASTEXITCODE -ne 0) { throw 'Symbol cache download failed' }
          $zip = 'symbol-input/bade-bc28-symbols.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '13bb6a4b438c29a8db618e4fb85630c75f1125a611e32a512c719e07ef57e317') { throw 'Symbol cache checksum mismatch' }
          New-Item al/.alpackages -ItemType Directory -Force | Out-Null
          Expand-Archive $zip al/.alpackages -Force
          'Microsoft BC 28.1 local symbol cache; SHA-256 13bb6a4b438c29a8db618e4fb85630c75f1125a611e32a512c719e07ef57e317' | Set-Content bc-symbol-version.txt
      - name: Compile extension
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          $version = (Get-Content al/app.json -Raw | ConvertFrom-Json).version
          $package = "dist/BCWMSApp-$version.app"
          al compile -- /project:al /packagecachepath:al/.alpackages /out:$package /errorsonlyinconsole
          if ($LASTEXITCODE -ne 0) { throw 'AL compilation failed' }
          if (-not (Test-Path $package)) { throw 'AL package was not produced' }
          Get-FileHash $package -Algorithm SHA256 | Format-List | Out-File dist/package-sha256.txt
          Copy-Item bc-symbol-version.txt dist/
          Copy-Item $package al/.alpackages/
      - name: Compile environment printer regression tests
        shell: pwsh
        run: |
          New-Item test-dist -ItemType Directory -Force | Out-Null
          al compile -- /project:al-print-tests /packagecachepath:al/.alpackages /out:test-dist/BCWMSApp-Print-Tests.app /errorsonlyinconsole
          if ($LASTEXITCODE -ne 0) { throw 'Print regression test compilation failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: bcwms-al-verified-package
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: bcwms-print-regression-test-package
          path: test-dist/
          if-no-files-found: error
