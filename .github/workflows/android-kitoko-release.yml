name: Kitoko Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Kitoko version, for example 1.14.182
        required: true
        type: string
        default: 1.14.182
      version_code:
        description: Monotonically increasing Android versionCode
        required: true
        type: number
        default: 200182
  push:
    branches:
      - customer/kitoko
    paths:
      - .github/workflows/android-kitoko-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version || '1.14.182' }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code || '200182' }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_VERSION_CODE" =~ ^[0-9]+$ ]]

      - name: Inject Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [[ -n "$KEY_PASSWORD" ]] || missing="$missing ANDROID_KEY_PASSWORD"
          [[ -n "$KEY_ALIAS" ]] || missing="$missing ANDROID_KEY_ALIAS"
          if [[ -n "$missing" ]]; then
            echo "::error::Missing Android signing secrets:$missing"
            exit 1
          fi
          mkdir -p android/play/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/play/keystore/upload-keystore.jks
          test -s android/play/keystore/upload-keystore.jks
          {
            echo "storeFile=play/keystore/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/play/keystore/keystore.properties

      - name: Build signed Kitoko APK
        working-directory: android
        env:
          RELEASE_VERSION: ${{ inputs.version || '1.14.182' }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code || '200182' }}
        run: |
          ./gradlew :app:assembleKitokoRelease \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            -PreleaseVersionName="$RELEASE_VERSION"

      - name: Verify permanent release certificate
        run: |
          APK="android/app/build/outputs/apk/kitoko/release/app-kitoko-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          EXPECTED="ea7710af652faf6beff836d64327159b021c0561297cf9ae60987d26592b81eb"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'certificate SHA-256 digest' | head -1 \
            | sed 's/.*digest: *//' | tr -d ' :' | tr 'A-F' 'a-f')
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Kitoko APK signing certificate does not match the installed release certificate."
            exit 1
          fi

      - name: Prepare APK and update manifest
        env:
          RELEASE_VERSION: ${{ inputs.version || '1.14.182' }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code || '200182' }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          APK="android/app/build/outputs/apk/kitoko/release/app-kitoko-release.apk"
          NAME="BCWMS-Kitoko-${RELEASE_VERSION}.apk"
          TAG="android-v${RELEASE_VERSION}-kitoko"
          cp "$APK" "dist/$NAME"
          SHA=$(sha256sum "dist/$NAME" | awk '{print $1}')
          jq -n \
            --argjson versionCode "$RELEASE_VERSION_CODE" \
            --arg versionName "${RELEASE_VERSION}-kitoko" \
            --arg repo "$REPO" \
            --arg tag "$TAG" \
            --arg name "$NAME" \
            --arg sha256 "$SHA" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:("https://github.com/"+$repo+"/releases/download/"+$tag+"/"+$name),sha256:$sha256,releaseNotes:("Kitoko Android "+$versionName+" — çoklu ürün etiketinde örnek baskı kontrolü")}' \
            > dist/latest.json

      - name: Publish Kitoko release and advance update channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || '1.14.182' }}
          REPO: ${{ github.repository }}
        run: |
          TAG="android-v${RELEASE_VERSION}-kitoko"
          NAME="BCWMS-Kitoko-${RELEASE_VERSION}.apk"
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "Kitoko Android ${RELEASE_VERSION}" \
            --notes "Kitoko terminaline çoklu ürün etiketlerinde örnek baskı ve onay adımı eklendi. Örnek etiket seçilen toplam adetten düşer." \
            "dist/$NAME" dist/latest.json
          if ! gh release view android-kitoko-channel --repo "$REPO" >/dev/null 2>&1; then
            gh release create android-kitoko-channel \
              --repo "$REPO" \
              --target customer/kitoko \
              --title "KİTOKO Güncelleme Kanalı" \
              --notes "KİTOKO uygulama içi güncelleme kanalı." \
              --prerelease
          fi
          gh release upload android-kitoko-channel dist/latest.json --repo "$REPO" --clobber
