name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve tag version
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing tag $GITHUB_REF_NAME (version $TAG)"

      - name: Verify AL app version matches tag (non-blocking)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          AL_VER=$(grep -o '"version": "[^"]*"' al/app.json | head -1 | sed -E 's/.*"version": "([^"]+)".*/\1/')
          echo "AL version in app.json: $AL_VER"
          echo "Tag-derived version: $TAG"
          # AL uses 4-segment semver (x.y.z.w). Tag is 3- or 4-segment.
          # Soft-check only — do not fail the release on minor mismatches.
          if [ "$AL_VER" != "$TAG" ] && [ "$AL_VER" != "${TAG}.0" ]; then
            echo "::warning::AL version ($AL_VER) does not match tag ($TAG) exactly. Continuing."
          fi

      - name: Collect release artifacts
        run: |
          mkdir -p release-assets
          # Prefer the actual built .app committed under releases/
          if ls releases/bcwmsapp-*.app >/dev/null 2>&1; then
            cp releases/bcwmsapp-*.app release-assets/
          else
            printf 'AL .app build is produced by configured BC build runners.\n' > release-assets/bcwmsapp.app.txt
          fi
          # Web source bundle (lightweight)
          zip -q release-assets/web-source.zip web/package.json web/src -r
          # Push relay (optional)
          if [ -f push-relay/package.json ]; then zip -q release-assets/push-relay.zip push-relay/package.json; fi
          ls -la release-assets/

      - name: Optional OIDC deployment gate
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "OIDC deploy skipped because Azure secrets are not configured."
          else
            echo "OIDC deploy secrets present; deployment hook can run in the release environment."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
