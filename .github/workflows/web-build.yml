name: Web Build

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  pull_request:
    paths:
      - "web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: web
        # Lockfile not yet committed — generate on the fly. Switch back to
        # --frozen-lockfile once web/pnpm-lock.yaml lands in the repo.
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Build
        working-directory: web
        run: pnpm build

